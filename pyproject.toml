[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entity-marker"
version = "0.4.0"
description = "Mark known entity occurrences for Label Studio"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2,<3",
    "pymorphy3>=2,<3",
]

[project.scripts]
entity-marker = "entity_marker.cli.app:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

